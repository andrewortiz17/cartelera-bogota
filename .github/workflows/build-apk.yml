name: Compilar APK

on:
  push:
    branches: [main]
    # No recompilar el APK cuando solo cambia la cartelera o los scrapers
    paths-ignore:
      - "app/www/data/**"
      - "scrapers/**"
      - "logs/**"
      - "*.bat"
      - "README.md"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner de GitHub ya trae el SDK de Android; solo aceptamos licencias
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Compilar APK de prueba (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bogocine-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
