name: Compilar para Google Play

# Se corre a mano: Actions > "Compilar para Google Play" > Run workflow.
# Necesita los secretos BOGOCINE_KEYSTORE_BASE64, BOGOCINE_KEYSTORE_PASSWORD,
# BOGOCINE_KEY_ALIAS y BOGOCINE_KEY_PASSWORD (ver llave-play/LEEME.txt en tu PC).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que verá la gente (p. ej. 1.0, 1.1)"
        required: true
        default: "1.0"

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Recuperar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.BOGOCINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto BOGOCINE_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bogocine.jks"

      - name: Compilar AAB y APK firmados
        env:
          BOGOCINE_KEYSTORE: ${{ runner.temp }}/bogocine.jks
          BOGOCINE_KEYSTORE_PASSWORD: ${{ secrets.BOGOCINE_KEYSTORE_PASSWORD }}
          BOGOCINE_KEY_ALIAS: ${{ secrets.BOGOCINE_KEY_ALIAS }}
          BOGOCINE_KEY_PASSWORD: ${{ secrets.BOGOCINE_KEY_PASSWORD }}
          # Google Play exige un número de versión que siempre suba: se usa el número de esta corrida
          BOGOCINE_VERSION_CODE: ${{ github.run_number }}
          BOGOCINE_VERSION_NAME: ${{ inputs.version }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Borrar la llave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/bogocine.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: bogocine-play-${{ inputs.version }}
          path: |
            app/android/app/build/outputs/bundle/release/app-release.aab
            app/android/app/build/outputs/apk/release/app-release.apk
