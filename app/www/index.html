<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <title>Cartelera Bogotá</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Cartelera <span>Bogotá</span></h1>
    <div id="demo-banner" class="banner" hidden>Datos de demostración · horarios inventados</div>
    <div class="chips" id="chips">
      <button class="chip on" data-tipo="cadena">Cadenas</button>
      <button class="chip on" data-tipo="cinemateca">Cinemateca</button>
      <button class="chip on" data-tipo="independiente">Independientes</button>
      <button class="chip on" data-tipo="cineclub">Cineclubes</button>
    </div>
  </header>

  <main>
    <section id="view-mapa" class="view active">
      <div id="map"></div>
      <button id="btn-locate" class="fab" aria-label="Usar mi ubicación">◎</button>
      <p class="hint" id="loc-hint">Buscando tu ubicación… (o toca el mapa para fijarla)</p>
    </section>

    <section id="view-cerca" class="view">
      <div class="controls">
        <label>Radio: <strong id="radio-val">5 km</strong>
          <input type="range" id="radio" min="1" max="25" value="5">
        </label>
        <label class="toggle"><input type="checkbox" id="proxima-hora"> Solo funciones en la próxima hora</label>
      </div>
      <ul id="lista-cerca" class="list"></ul>
    </section>

    <section id="view-peliculas" class="view">
      <input id="buscar" class="search" type="search" placeholder="Buscar película…">
      <ul id="lista-peliculas" class="list"></ul>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="mapa" class="active">Mapa</button>
    <button data-view="cerca">Cerca de mí</button>
    <button data-view="peliculas">Películas</button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <button class="sheet-close" id="sheet-close" aria-label="Cerrar">✕</button>
    <div id="sheet-body"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
